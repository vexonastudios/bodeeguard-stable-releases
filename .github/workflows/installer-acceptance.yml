name: Real Windows installer acceptance
on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: choice
        default: stable
        options: [stable, test]
      version:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the exact parent installer on a disposable Windows VM
        shell: powershell
        env:
          BG_CHANNEL: ${{ inputs.channel }}
          BG_VERSION: ${{ inputs.version }}
          BG_EXPECTED_SHA: ${{ inputs.sha256 }}
          BG_EXPECTED_SIZE: ${{ inputs.size }}
        run: ./acceptance/windows-installer.ps1
      - name: Preserve exact-artifact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 30
